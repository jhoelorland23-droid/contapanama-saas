</script>
<style>
  :root {
    /* Deep black base */
    --bg: #0A0A0B;
    --bg-elev: #0F0F11;
    --surface: #131317;
    --surface-2: #18181C;
    --surface-3: #1F1F24;
    --hairline: rgba(255,255,255,0.06);
    --hairline-strong: rgba(255,255,255,0.1);

    /* Text */
    --text: #FAFAFA;
    --text-2: #C4C4C7;
    --text-3: #8A8A8E;
    --text-4: #5A5A5E;
    --text-5: #3F3F45;

    /* Accents — soft luxury gold + warm tech orange */
    --gold: #D4A86A;
    --gold-2: #B98C4D;
    --gold-soft: rgba(212,168,106,0.12);
    --gold-glow: rgba(212,168,106,0.4);

    --orange: #FF7849;
    --orange-2: #E25C2D;
    --orange-soft: rgba(255,120,73,0.1);

    /* Semantic */
    --green: #4ADE80;
    --green-soft: rgba(74,222,128,0.1);
    --red: #F87171;
    --red-soft: rgba(248,113,113,0.1);
    --blue: #60A5FA;
    --blue-soft: rgba(96,165,250,0.1);
    --violet: #A78BFA;
    --violet-soft: rgba(167,139,250,0.1);

    /* Glass */
    --glass: rgba(255,255,255,0.02);
    --glass-2: rgba(255,255,255,0.04);
    --glass-strong: rgba(255,255,255,0.06);

    /* Shadow */
    --shadow-s: 0 1px 2px rgba(0,0,0,.5);
    --shadow-m: 0 10px 30px rgba(0,0,0,.3), 0 1px 2px rgba(0,0,0,.5);
    --shadow-lg: 0 30px 80px rgba(0,0,0,.5), 0 4px 12px rgba(0,0,0,.6);
    --shadow-glow: 0 0 40px var(--gold-glow);
  }

  * { box-sizing: border-box }
  html, body, #root { margin: 0; padding: 0; height: 100%; width: 100%; }
  html { background: var(--bg); color: var(--text); }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    font-feature-settings: "ss01", "cv02", "cv11";
    text-rendering: optimizeLegibility;
    overflow: hidden;
  }

  ::selection { background: var(--gold-soft); color: var(--gold); }

  /* Type */
  .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum", "ss01"; }
  .serif { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; letter-spacing: -0.015em; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; letter-spacing: 0; font-feature-settings: "ss01"; }

  .display-xl { font-size: 96px; line-height: 0.95; letter-spacing: -0.04em; font-weight: 700; }
  .display-l  { font-size: 72px; line-height: 0.98; letter-spacing: -0.035em; font-weight: 700; }
  .display-m  { font-size: 48px; line-height: 1.02; letter-spacing: -0.03em; font-weight: 700; }
  .display-s  { font-size: 36px; line-height: 1.05; letter-spacing: -0.025em; font-weight: 700; }
  .h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.2; }
  .h2 { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.3; }
  .h3 { font-size: 14px; font-weight: 600; letter-spacing: -0.005em; line-height: 1.4; }
  .body { font-size: 13.5px; line-height: 1.55; color: var(--text-2); }
  .body-s { font-size: 12.5px; line-height: 1.5; color: var(--text-3); }
  .caption { font-size: 11.5px; line-height: 1.4; color: var(--text-3); }
  .eyebrow {
    font-size: 10.5px; font-weight: 600; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--text-4);
  }

  /* Cards / surfaces */
  .card {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 14px;
    box-shadow: var(--shadow-s);
  }
  .card.elev { background: var(--surface-2); }
  .card.glass {
    background: var(--glass-2);
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    border-color: var(--hairline-strong);
  }
  .card.bordered { border: 1px solid var(--hairline-strong); }
  .card.gold {
    background: linear-gradient(180deg, rgba(212,168,106,0.06) 0%, var(--surface) 100%);
    border-color: rgba(212,168,106,0.2);
  }

  /* Pills */
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 9px; border-radius: 999px;
    font-size: 10.5px; font-weight: 500; letter-spacing: 0.01em;
    line-height: 1.4;
  }
  .pill.gold { background: var(--gold-soft); color: var(--gold); }
  .pill.green { background: var(--green-soft); color: var(--green); }
  .pill.red { background: var(--red-soft); color: var(--red); }
  .pill.blue { background: var(--blue-soft); color: var(--blue); }
  .pill.violet { background: var(--violet-soft); color: var(--violet); }
  .pill.orange { background: var(--orange-soft); color: var(--orange); }
  .pill.ghost {
    background: var(--glass);
    color: var(--text-3);
    border: 1px solid var(--hairline);
  }
  .pill .dot { width: 5px; height: 5px; border-radius: 999px; background: currentColor; }
  .pill .kbd {
    padding: 1px 5px; border-radius: 4px;
    background: var(--glass-2); color: var(--text-3);
    font-family: "JetBrains Mono", monospace; font-size: 10px;
    border: 1px solid var(--hairline);
  }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 8px 14px; border-radius: 8px;
    font-size: 12.5px; font-weight: 500;
    border: 1px solid var(--hairline-strong);
    background: var(--glass-2); color: var(--text);
    cursor: pointer; user-select: none; font-family: inherit;
    transition: all .15s cubic-bezier(.4,0,.2,1);
  }
  .btn:hover {
    background: var(--glass-strong);
    border-color: rgba(255,255,255,0.16);
    transform: translateY(-0.5px);
  }
  .btn:active { transform: translateY(0); }
  .btn.primary {
    background: var(--text); color: var(--bg);
    border-color: var(--text);
  }
  .btn.primary:hover { background: var(--text-2); }
  .btn.gold {
    background: var(--gold); color: #1a1306;
    border-color: var(--gold);
    box-shadow: 0 0 20px rgba(212,168,106,0.25);
  }
  .btn.gold:hover { background: var(--gold-2); box-shadow: 0 0 30px rgba(212,168,106,0.4); }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--text-3); }
  .btn.ghost:hover { background: var(--glass-2); color: var(--text); }
  .btn.s { padding: 5px 10px; font-size: 11px; border-radius: 6px; }
  .btn.lg { padding: 12px 18px; font-size: 13.5px; border-radius: 10px; }

  /* KBD shortcut */
  .kbd {
    padding: 2px 6px; border-radius: 5px;
    background: var(--glass-2); color: var(--text-3);
    font-family: "JetBrains Mono", monospace; font-size: 10.5px;
    border: 1px solid var(--hairline);
    line-height: 1;
  }

  /* Tables */
  .tbl { width: 100%; border-collapse: collapse; }
  .tbl th {
    font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--text-4); text-align: left; font-weight: 500;
    padding: 10px 16px; border-bottom: 1px solid var(--hairline);
  }
  .tbl td {
    padding: 14px 16px;
    border-bottom: 1px solid var(--hairline);
    font-size: 13px; color: var(--text-2);
  }
  .tbl tr:last-child td { border-bottom: 0 }
  .tbl tr.hoverable { cursor: pointer; transition: background .12s; }
  .tbl tr.hoverable:hover td { background: var(--glass); }
  .tbl .r { text-align: right; }

  /* Inputs */
  input, select, textarea {
    font-family: inherit; font-size: 13px;
    padding: 9px 12px; border-radius: 8px;
    background: var(--glass-2); color: var(--text);
    border: 1px solid var(--hairline-strong); outline: none;
    transition: border-color .15s, background .15s;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--gold); background: var(--glass-strong);
  }
  input::placeholder, textarea::placeholder { color: var(--text-4); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--hairline-strong); border-radius: 99px; border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-5); background-clip: padding-box; }

  /* Animations */
  @keyframes fade-up {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .anim-in { animation: fade-up .5s cubic-bezier(.2,.7,.2,1) both; }
  .anim-in.d1 { animation-delay: .04s; }  .anim-in.d2 { animation-delay: .08s; }
  .anim-in.d3 { animation-delay: .12s; }  .anim-in.d4 { animation-delay: .16s; }
  .anim-in.d5 { animation-delay: .20s; }  .anim-in.d6 { animation-delay: .24s; }
  .anim-in.d7 { animation-delay: .28s; }  .anim-in.d8 { animation-delay: .32s; }

  @keyframes shimmer {
    0% { background-position: -800px 0; }
    100% { background-position: 800px 0; }
  }
  .skeleton {
    background: linear-gradient(90deg, var(--glass) 0%, var(--glass-strong) 50%, var(--glass) 100%);
    background-size: 800px 100%;
    animation: shimmer 1.6s infinite linear;
    border-radius: 6px;
  }

  @keyframes pulse-breath {
    0%, 100% { transform: scale(1); opacity: 0.85 }
    50%      { transform: scale(1.4); opacity: 1 }
  }
  .breathe { animation: pulse-breath 2.6s ease-in-out infinite; }

  @keyframes ai-glow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(212,168,106,0.4), 0 0 20px rgba(212,168,106,0.2); }
    50%      { box-shadow: 0 0 0 8px rgba(212,168,106,0), 0 0 40px rgba(212,168,106,0.4); }
  }
  .ai-glow { animation: ai-glow 2.6s ease-in-out infinite; }

  /* Toast */
  @keyframes toast-in {
    from { opacity: 0; transform: translate(-50%, 12px); }
    to   { opacity: 1; transform: translate(-50%, 0); }
  }
  .toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    background: var(--surface-2); color: var(--text);
    padding: 11px 18px; border-radius: 999px;
    font-size: 12.5px; font-weight: 500;
    display: flex; align-items: center; gap: 10px;
    border: 1px solid var(--hairline-strong);
    box-shadow: var(--shadow-lg);
    z-index: 1000; animation: toast-in .25s ease-out;
  }

  /* Command palette */
  .palette-scrim {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,.6);
    backdrop-filter: blur(8px) saturate(120%);
    -webkit-backdrop-filter: blur(8px) saturate(120%);
    animation: fade-up .15s both;
  }

  /* Ambient gradient orbs (cinematic lighting) */
  .ambient-orbs { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .orb {
    position: absolute; border-radius: 50%;
    filter: blur(60px); opacity: 0.5;
  }
  .orb.gold { background: radial-gradient(circle, rgba(212,168,106,0.5), transparent 70%); }
  .orb.orange { background: radial-gradient(circle, rgba(255,120,73,0.35), transparent 70%); }
  .orb.violet { background: radial-gradient(circle, rgba(167,139,250,0.3), transparent 70%); }

  /* Grain (cinematic film texture, very subtle) */
  .grain {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    opacity: 0.04; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.95' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.7'/%3E%3C/svg%3E");
  }

  /* Focus ring (accessibility) */
  *:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px; border-radius: 4px;
  }
</style>
</head>
