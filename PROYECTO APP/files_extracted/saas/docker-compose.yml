version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: contapanama_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido}
      POSTGRES_DB: contapanama
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/migration_fase2.sql:/docker-entrypoint-initdb.d/02_migration_fase2.sql:ro
      - ./database/migration_fase2b.sql:/docker-entrypoint-initdb.d/03_migration_fase2b.sql:ro
      - ./database/migration_fase3.sql:/docker-entrypoint-initdb.d/04_migration_fase3.sql:ro
      - ./database/migration_fase4.sql:/docker-entrypoint-initdb.d/05_migration_fase4.sql:ro
      - ./database/migration_fase5.sql:/docker-entrypoint-initdb.d/06_migration_fase5.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d contapanama"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: contapanama_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@contapanama.pa
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD requerido}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  pg_data:
  pgadmin_data:
